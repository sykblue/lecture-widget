name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci || npm install
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: LectureWidget-windows
          path: dist/*.exe

  mac:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            script: dist:mac-arm
            label: mac-apple-silicon
          - arch: x64
            script: dist:mac-intel
            label: mac-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci || npm install
      - run: npm run ${{ matrix.script }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: LectureWidget-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip

  # 태그(v*)로 빌드했을 때만: 세 빌드 결과를 모아 GitHub Releases 에 올린다 → 누구나 로그인 없이 다운로드
  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## 다운로드
            - **Windows 설치형**: `LectureWidget-*-win-x64.exe`
            - **Windows 무설치**: `LectureWidget-*-portable.exe` — 받아서 바로 실행
            - **Mac (Apple 칩 M1~)**: `*-mac-arm64.dmg` / **Mac (인텔)**: `*-mac-x64.dmg`

            처음 실행할 때 Windows "PC 보호" 창이 뜨면 **추가 정보 → 실행** (코드 서명 인증서가 없는 개인 프로젝트라 뜨는 안내입니다).
            Mac 은 **우클릭 → 열기** 로 한 번 열어 주세요.
            요약에는 [Ollama](https://ollama.com) 가 필요합니다 (README 참고).
